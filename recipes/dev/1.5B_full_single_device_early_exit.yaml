output_dir: /tmp/torchtune/qwen2_5_1_5B/early_exit_single_device # /tmp may be deleted by your system. Change it to your preference.

# Model arguments
model:
  _component_: torchtune.models.qwen2_5.qwen2_5_1_5b_instruct  

# Tokenizer
tokenizer:
  _component_: torchtune.models.qwen2_5.qwen2_5_tokenizer
  path: /tmp/Qwen2.5-1.5B-Instruct/vocab.json
  merges_file: /tmp/Qwen2.5-1.5B-Instruct/merges.txt
  max_seq_len: 10000

# Checkpointer
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /tmp/Qwen2.5-1.5B-Instruct
  checkpoint_files: [model.safetensors]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2
resume_from_checkpoint: False

# Dataset
dataset:
  _component_: torchtune.datasets.instruct_dataset
  source: "parquet"
  data_files: "gsm8k_train_transformed.parquet"
  train_on_input: False
  packed: False
  split: train
  column_map:
    input: question
    output: answer

seed: null
shuffle: True

# Fine-tuning arguments
epochs: 5
max_steps_per_epoch: null
batch_size: 8
gradient_accumulation_steps: 1  # Use to increase effective batch size
optimizer:
  _component_: bitsandbytes.optim.PagedAdamW
  lr: 2e-5
optimizer_in_bwd: True  # True saves memory. Requires gradient_accumulation_steps=1
loss:
  _component_: torch.nn.CrossEntropyLoss

# Training env
device: cuda

# Memory management / performance
enable_activation_checkpointing: True  # True reduces memory
enable_activation_offloading: False  # True reduces memory
dtype: bf16
clip_grad_norm: null
compile: False  # torch.compile the model + loss, True increases speed + decreases memory

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs
log_every_n_steps: 1
log_peak_memory_stats: True

# Profiler (disabled)
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False

  #Output directory of trace artifacts
  output_dir: ${output_dir}/profiling_outputs

  #`torch.profiler.ProfilerActivity` types to trace
  cpu: True
  cuda: True

  #trace options passed to `torch.profiler.profile`
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False

  # `torch.profiler.schedule` options:
  # wait_steps -> wait, warmup_steps -> warmup, active_steps -> active, num_cycles -> repeat
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1

# Early Exit Loss
early_exit_loss:
  layers: "0::4"
  curriculum: torchtune.modules.early_exit_loss.RotationalEarlyExitCurriculum
  scale_fn: torchtune.modules.early_exit_loss.sum_l_loss_scale
  scale: 1.0
  think_start_token: "<|box_start|>"
  think_end_token: "<|box_end|>"
